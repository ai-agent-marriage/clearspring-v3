name: SSH Test

on:
  push:
    branches: [main]

jobs:
  ssh-test:
    runs-on: ubuntu-latest
    steps:
      - name: Test SSH Connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VOLCANO_HOST }}
          username: ${{ secrets.VOLCANO_SSH_USER }}
          key: ${{ secrets.VOLCANO_SSH_KEY }}
          script: |
            echo "SSH 连接成功！"
            whoami
            hostname
            ls -la /home/clearspring-bot/
