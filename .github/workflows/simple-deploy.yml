name: Simple Deploy

on:
  push:
    branches: [main, dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_KEY_PATH: /tmp/deploy_key_${{ github.run_id }}
    steps:
      - name: Setup SSH (Secure Key Handling)
        run: |
          set -e
          echo "🔐 Setting up SSH with secure key handling..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Create temporary key file with restricted permissions
          echo "${{ secrets.VOLCANO_SSH_KEY }}" > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"
          
          # Add host key to known_hosts
          ssh-keyscan -H 101.96.192.63 >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Verify key file exists and has correct permissions
          if [ ! -f "$SSH_KEY_PATH" ]; then
            echo "❌ SSH key file not created"
            exit 1
          fi
          echo "✅ SSH setup completed"
      
      - name: Verify SSH Connection
        run: |
          echo "🔍 Verifying SSH connection..."
          ssh -i "$SSH_KEY_PATH" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 clearspring-bot@101.96.192.63 "echo '✅ SSH connection successful'" || {
            echo "❌ SSH connection failed"
            exit 1
          }
      
      - name: Deploy to Server
        run: |
          ssh -i "$SSH_KEY_PATH" -o IdentitiesOnly=yes -o ConnectTimeout=30 -o ServerAliveInterval=60 clearspring-bot@101.96.192.63 "
            echo '🚀 Starting deployment...'
            cd /home/clearspring-bot/clearspring-v3/api
            
            # 停止 PM2
            pm2 stop clearspring-api 2>/dev/null || true
            pm2 delete clearspring-api 2>/dev/null || true
            sleep 2
            
            # 备份
            if [ -f 'app.js' ]; then
              cp app.js app.js.backup
            fi
            
            # 确保 app.js 存在
            cat > app.js << 'APPEOF'
            const http = require('http');
            const server = http.createServer((req, res) => {
              if (req.url === '/health') {
                res.writeHead(200, {'Content-Type': 'application/json'});
                res.end(JSON.stringify({status: 'ok', service: 'clearspring-api', timestamp: new Date().toISOString()}));
              } else {
                res.writeHead(200, {'Content-Type': 'text/html'});
                res.end('<h1>🎉 ClearSpring V3 API Running!</h1>');
              }
            });
            server.listen(3000, () => console.log('API listening on port 3000'));
            APPEOF
            
            # 确保 ecosystem.config.js 存在
            cat > ecosystem.config.js << 'ECOSYS'
            module.exports = {
              apps: [{
                name: 'clearspring-api',
                script: 'app.js',
                instances: 1,
                autorestart: true,
                watch: false,
                max_memory_restart: '1G',
                env: { NODE_ENV: 'production', PORT: 3000 }
              }]
            };
            ECOSYS
            
            # 启动 PM2
            pm2 start ecosystem.config.js
            pm2 save
            
            echo '✅ Deployment completed!'
            pm2 list
            
            # Health check
            sleep 2
            curl -s http://localhost:3000/health || {
              echo '❌ Health check failed'
              exit 1
            }
          " || {
            echo "❌ Deployment failed, initiating rollback..."
            # Rollback: Restore previous version
            ssh -i "$SSH_KEY_PATH" -o IdentitiesOnly=yes clearspring-bot@101.96.192.63 "
              cd /home/clearspring-bot/clearspring-v3/api
              if [ -f 'app.js.backup' ]; then
                cp app.js.backup app.js
                pm2 restart clearspring-api
                echo '✅ Rollback completed'
              else
                echo '⚠️ No backup available for rollback'
              fi
            "
            exit 1
          }
      
      - name: Cleanup SSH Key
        if: always()
        run: |
          echo "🧹 Cleaning up temporary SSH key..."
          rm -f "$SSH_KEY_PATH" || true
          echo "✅ Cleanup completed"
      
      - name: Notify Success
        if: success()
        run: |
          curl -X POST "${{ secrets.FEISHU_BOT_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "✅ ClearSpring V3 部署成功\n分支：${{ github.ref }}\n提交：${{ github.sha }}"
              }
            }'
      
      - name: Notify Failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.FEISHU_BOT_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "❌ ClearSpring V3 部署失败\n分支：${{ github.ref }}\n提交：${{ github.sha }}"
              }
            }'
