name: E2E Executor Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'e2e-executor/**'
      - '.github/workflows/e2e-executor-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'e2e-executor/**'
  workflow_dispatch:

jobs:
  test:
    name: Run Executor E2E Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
          npm install -D @playwright/test
          npx playwright install chromium --with-deps
      
      - name: Run Playwright tests
        run: |
          cd e2e-executor
          npx playwright test --project=chromium --reporter=html,list
      
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-executor
          path: playwright-report-executor/
          retention-days: 30
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-executor
          path: |
            e2e-executor/test-results/
            e2e-executor/playwright-report-executor/
          retention-days: 7

  # 生产环境测试（可选）
  test-production:
    name: Run Production Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
          npm install -D @playwright/test
          npx playwright install chromium --with-deps
      
      - name: Run production tests
        run: |
          cd e2e-executor
          BASE_URL=https://wx.qq.com npx playwright test --project=production --reporter=html,list
      
      - name: Upload production report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-production
          path: playwright-report-executor/
          retention-days: 30
