name: Test Secrets

on:
  workflow_dispatch:  # 手动触发

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check Secrets
        run: |
          echo "🔍 Checking GitHub Secrets..."
          
          # 检查 Secrets 是否存在（不显示具体值）
          if [ -n "${{ secrets.VOLCANO_SSH_KEY }}" ]; then
            echo "✅ VOLCANO_SSH_KEY: 已配置"
          else
            echo "❌ VOLCANO_SSH_KEY: 未配置"
          fi
          
          if [ -n "${{ secrets.VOLCANO_HOST }}" ]; then
            echo "✅ VOLCANO_HOST: 已配置"
          else
            echo "❌ VOLCANO_HOST: 未配置"
          fi
          
          if [ -n "${{ secrets.WX_APP_ID }}" ]; then
            echo "✅ WX_APP_ID: 已配置"
          else
            echo "❌ WX_APP_ID: 未配置"
          fi
          
          if [ -n "${{ secrets.WX_APP_SECRET }}" ]; then
            echo "✅ WX_APP_SECRET: 已配置"
          else
            echo "❌ WX_APP_SECRET: 未配置"
          fi
          
          if [ -n "${{ secrets.FEISHU_BOT_URL }}" ]; then
            echo "✅ FEISHU_BOT_URL: 已配置"
          else
            echo "❌ FEISHU_BOT_URL: 未配置"
          fi
          
          echo ""
          echo "📊 Secrets 检查完成！"
