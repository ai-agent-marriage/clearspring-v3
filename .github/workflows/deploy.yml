name: ClearSpring V3 CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # 代码质量检查
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run ESLint
        run: npm run lint || true
      
      - name: Run tests
        run: npm test || true

  # 小程序端构建
  miniprogram-build:
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd miniprogram
          npm install
      
      - name: Build miniprogram
        run: |
          cd miniprogram
          npm run build
        env:
          WX_APP_ID: ${{ secrets.WX_APP_ID }}
          WX_CLOUD_ENV_ID: ${{ secrets.WX_CLOUD_ENV_ID }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniprogram-dist
          path: miniprogram/
          retention-days: 7

  # 后端 API 构建与部署
  backend-deploy:
    runs-on: ubuntu-latest
    needs: miniprogram-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Build backend
        run: |
          cd projects
          npm install
          npm run build
      
      - name: Deploy to Volcano Cloud
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VOLCANO_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VOLCANO_HOST }}
          REMOTE_USER: ${{ secrets.VOLCANO_SSH_USER }}
          SOURCE: "projects/dist/"
          TARGET: "/opt/clearspring-v3/api"
          SCRIPT_AFTER: |
            cd /opt/clearspring-v3/api
            pm2 restart ${{ secrets.PM2_APP_NAME }} || pm2 start app.js --name ${{ secrets.PM2_APP_NAME }}
      
      - name: Notify Feishu (Success)
        if: success()
        run: |
          curl -X POST "${{ secrets.FEISHU_BOT_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "✅ ClearSpring V3 部署成功\n分支：${{ github.ref }}\n提交：${{ github.sha }}\n时间：$(date -Iseconds)"
              }
            }'
      
      - name: Notify Feishu (Failure)
        if: failure()
        run: |
          curl -X POST "${{ secrets.FEISHU_BOT_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "❌ ClearSpring V3 部署失败\n分支：${{ github.ref }}\n提交：${{ github.sha }}\n请检查：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            }'

  # 邮件通知（可选）
  email-notification:
    runs-on: ubuntu-latest
    needs: backend-deploy
    if: always()
    
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ClearSpring V3 部署${{ needs.backend-deploy.result }}
          to: ${{ secrets.GMAIL_ADDRESS }}
          from: ClearSpring V3 CI/CD
          body: |
            部署结果：${{ needs.backend-deploy.result }}
            仓库：${{ github.repository }}
            分支：${{ github.ref }}
            提交：${{ github.sha }}
            查看日志：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
