name: Final SSH Test

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VOLCANO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 101.96.192.63 >> ~/.ssh/known_hosts
      
      - name: Test SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes clearspring-bot@101.96.192.63 "
            echo '✅ SSH Connected!'
            whoami
            hostname
            date
            ls -la /home/clearspring-bot/
          "
