<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed": "#d3e8d5",
                    "tertiary-fixed-dim": "#e2c19b",
                    "surface": "#faf9f4",
                    "primary-fixed-dim": "#b7ccb9",
                    "on-tertiary-container": "#ebcaa3",
                    "on-secondary-fixed-variant": "#534600",
                    "surface-container-low": "#f5f4ef",
                    "secondary": "#6e5e00",
                    "on-surface-variant": "#434843",
                    "surface-container": "#efeee9",
                    "secondary-container": "#fee264",
                    "outline": "#737872",
                    "on-tertiary-fixed": "#291801",
                    "on-tertiary": "#ffffff",
                    "background": "#faf9f4",
                    "surface-container-high": "#e9e8e3",
                    "inverse-surface": "#30312e",
                    "tertiary": "#533d20",
                    "error": "#ba1a1a",
                    "on-background": "#1b1c19",
                    "on-primary-fixed": "#0e1f13",
                    "on-primary-fixed-variant": "#394b3d",
                    "primary-container": "#4a5d4e",
                    "error-container": "#ffdad6",
                    "on-error": "#ffffff",
                    "surface-bright": "#faf9f4",
                    "on-tertiary-fixed-variant": "#594325",
                    "on-error-container": "#93000a",
                    "inverse-primary": "#b7ccb9",
                    "surface-dim": "#dbdad5",
                    "surface-container-highest": "#e3e2de",
                    "tertiary-container": "#6d5435",
                    "tertiary-fixed": "#ffddb6",
                    "on-surface": "#1b1c19",
                    "on-secondary": "#ffffff",
                    "primary": "#334537",
                    "secondary-fixed": "#fee264",
                    "inverse-on-surface": "#f2f1ec",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-container": "#756400",
                    "outline-variant": "#c3c8c1",
                    "surface-variant": "#e3e2de",
                    "on-secondary-fixed": "#211b00",
                    "on-primary-container": "#c0d5c2",
                    "surface-tint": "#506354",
                    "secondary-fixed-dim": "#e0c64b",
                    "on-primary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Noto Serif SC", "serif"],
                    "body": ["Plus Jakarta Sans", "sans-serif"],
                    "label": ["Plus Jakarta Sans", "sans-serif"]
            }
          },
        },
      }
    </script>
<style>
        .font-noto-serif { font-family: 'Noto Serif SC', serif; }
        .font-plus-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ink-wash-bg {
            background: linear-gradient(135deg, rgba(250, 249, 244, 0) 0%, rgba(51, 69, 55, 0.03) 50%, rgba(250, 249, 244, 0) 100%);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body leading-relaxed pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#334537] dark:bg-[#1a241c] shadow-sm dark:shadow-none flex items-center px-4 h-14 w-full">
<div class="flex items-center w-full">
<span class="material-symbols-outlined text-[#FAF9F4] mr-4 active:scale-95 duration-150 cursor-pointer" data-icon="arrow_back">arrow_back</span>
<h1 class="font-noto-serif text-lg tracking-wide text-[#FAF9F4] font-bold">护生委托服务</h1>
</div>
</header>
<main class="mt-14 px-4 pt-4 space-y-4 max-w-2xl mx-auto">
<!-- Compliance Declaration Section - Reduced Padding -->
<section class="bg-surface-container-lowest rounded-xl p-4 shadow-[0_12px_40px_rgba(74,93,78,0.06)] overflow-hidden relative border-l-4 border-primary">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-lg" data-icon="gavel">gavel</span>
<h2 class="font-headline text-base font-bold text-primary">合规声明</h2>
</div>
<div class="text-[13px] text-on-surface-variant space-y-1 font-body leading-relaxed">
<p>1. 严格遵守法律法规，所有物种合法且经评估。</p>
<p>2. 执行水域经调研，确保不对生态造成负面影响。</p>
<p>3. 委托方承诺动机纯粹，不涉及非法交易。</p>
</div>
<label class="mt-3 flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary transition-all cursor-pointer" type="checkbox"/>
<span class="text-xs font-semibold text-primary group-hover:opacity-80">我已阅读并知晓相关规则</span>
</label>
</section>
<!-- Main Form Section - Compact with Horizontal Labels -->
<section class="bg-surface-container-low rounded-xl p-4 space-y-4">
<div class="flex items-center justify-between border-b border-outline-variant/15 pb-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary text-xl" data-icon="assignment">assignment</span>
<h3 class="font-headline text-lg text-primary font-bold">委托单详情</h3>
</div>
<span class="text-[10px] text-on-surface-variant/60 tracking-widest font-bold">* 为必填项</span>
</div>
<div class="space-y-3">
<!-- Exec Date -->
<div class="grid grid-cols-[100px_1fr] items-center gap-4">
<label class="text-sm font-semibold text-on-surface">
                    执行日期 <span class="text-error">*</span>
</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-none rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary/20 outline-none appearance-none" type="date"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-lg pointer-events-none" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<!-- Exec Waters -->
<div class="grid grid-cols-[100px_1fr] items-center gap-4">
<label class="text-sm font-semibold text-on-surface">
                    执行水域 <span class="text-error">*</span>
</label>
<select class="w-full bg-surface-container-lowest border-none rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary/20 outline-none appearance-none">
<option value="">请选择水域</option>
<option value="1">云梦泽生态保护区</option>
<option value="2">澜沧江上游净域</option>
<option value="3">东海近郊自然海域</option>
</select>
</div>
<!-- Species -->
<div class="grid grid-cols-[100px_1fr] items-center gap-4">
<label class="text-sm font-semibold text-on-surface">
                    物种规格 <span class="text-error">*</span>
</label>
<select class="w-full bg-surface-container-lowest border-none rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary/20 outline-none appearance-none">
<option value="">请选择物种</option>
<option value="1">原生青鱼 (3-5cm)</option>
<option value="2">锦鲤苗 (精选品级)</option>
<option value="3">中华圆田螺 (成年)</option>
</select>
</div>
<!-- Count -->
<div class="grid grid-cols-[100px_1fr] items-center gap-4">
<label class="text-sm font-semibold text-on-surface">
                    投放份数 <span class="text-error">*</span>
</label>
<input class="w-full bg-surface-container-lowest border-none rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary/20 outline-none" min="1" placeholder="请输入数量" type="number" value="1"/>
</div>
</div>
<!-- Value Added Services - More Compact -->
<div class="space-y-2 pt-1">
<label class="block text-sm font-semibold text-on-surface">增值服务</label>
<div class="grid grid-cols-3 gap-2">
<label class="flex flex-col items-center text-center p-2 bg-surface-container-lowest rounded-lg cursor-pointer border border-transparent active:border-primary/20">
<input class="rounded border-outline-variant text-primary focus:ring-primary mb-1.5" type="checkbox"/>
<span class="text-[11px] font-medium leading-tight">视频记录</span>
</label>
<label class="flex flex-col items-center text-center p-2 bg-surface-container-lowest rounded-lg cursor-pointer border border-transparent active:border-primary/20">
<input class="rounded border-outline-variant text-primary focus:ring-primary mb-1.5" type="checkbox"/>
<span class="text-[11px] font-medium leading-tight">心愿标识</span>
</label>
<label class="flex flex-col items-center text-center p-2 bg-surface-container-lowest rounded-lg cursor-pointer border border-transparent active:border-primary/20">
<input class="rounded border-outline-variant text-primary focus:ring-primary mb-1.5" type="checkbox"/>
<span class="text-[11px] font-medium leading-tight">监测报告</span>
</label>
</div>
</div>
<!-- Wish Message - Shorter Textarea -->
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-on-surface">心愿寄语</label>
<textarea class="w-full bg-surface-container-lowest border-none rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary/20 outline-none resize-none" maxlength="200" placeholder="写下您的美好祝愿..." rows="3"></textarea>
<div class="text-[10px] text-right text-on-surface-variant/40">0 / 200</div>
</div>
<!-- Requester Info - Compact -->
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-on-surface">委托方信息 <span class="text-error">*</span></label>
<div class="flex items-center gap-2 bg-surface-container-lowest rounded-lg px-3 py-2">
<img alt="User Avatar" class="w-7 h-7 rounded-full border border-outline-variant/10" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDJTEsav7symK1NzBcYRhtz2Td2AuiFgWXdlqSWjCW07cuvBE4f8B6r2WZNCoRaE3lr0CGkxifVwH-LmZ9I05XogmcxgIEzpisCgG5No7N_x0fmG9k4Pd4m4iIoTiFQYKmahOCbQ6_q8CUv8sHnlph7Ar377LD7NUr9nx4uvYoVDt8yhxNg1scDSLFgkJUT1IYc9Suo0uCXk7D1ThigRnq2xgnJPRR-kdN6SBJKBPQgyy5UrAndtAvZ6wFEn8FvcnNj8ldyBw356RfG"/>
<input class="flex-1 bg-transparent border-none text-sm focus:ring-0 font-medium py-0" readonly="" type="text" value="云水禅心"/>
<span class="text-[9px] font-bold text-on-surface-variant/40 uppercase tracking-tighter">WeChat Nickname</span>
</div>
</div>
</section>
<!-- Decorative Quote Card - More Compact -->
<div class="py-4 text-center ink-wash-bg">
<p class="font-headline text-base text-primary/60 italic opacity-80 leading-relaxed">
            “上善若水，水利万物而不争。”
        </p>
</div>
</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-16 left-0 w-full z-50 bg-surface-container-lowest px-6 py-3 flex items-center justify-between shadow-[0_-4px_20px_rgba(74,93,78,0.06)]">
<div class="flex flex-col">
<span class="text-[10px] text-on-surface-variant/60 font-bold tracking-wider">服务套餐总额</span>
<div class="flex items-baseline gap-1">
<span class="text-xs text-primary font-bold">¥</span>
<span class="text-2xl font-noto-serif font-bold text-primary">0.00</span>
</div>
</div>
<button class="bg-primary text-on-primary px-8 py-3 rounded-lg font-headline font-bold text-sm shadow-lg active:scale-95 transition-all">
        确认委托单
    </button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 border-t-[0.5px] border-[#334537]/15 bg-[#FAF9F4] dark:bg-[#1C1B17] shadow-[0_-4px_20px_rgba(74,93,78,0.04)] flex justify-around items-center h-16 w-full px-6">
<a class="flex flex-col items-center justify-center text-[#334537]/60 dark:text-[#EFEEE9]/50 px-4 py-1 hover:bg-[#334537]/5 dark:hover:bg-[#EFEEE9]/5 transition-opacity" href="#">
<span class="material-symbols-outlined mb-0.5" data-icon="library_music">library_music</span>
<span class="font-plus-jakarta text-[10px] tracking-tight">梵音</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#4A5D4E]/10 dark:bg-[#C9B037]/20 text-[#334537] dark:text-[#C9B037] rounded-xl px-4 py-1" href="#">
<span class="material-symbols-outlined mb-0.5" data-icon="self_improvement" style="font-variation-settings: 'FILL' 1;">self_improvement</span>
<span class="font-plus-jakarta text-[10px] tracking-tight font-bold">禅理</span>
</a>
<a class="flex flex-col items-center justify-center text-[#334537]/60 dark:text-[#EFEEE9]/50 px-4 py-1 hover:bg-[#334537]/5 dark:hover:bg-[#EFEEE9]/5 transition-opacity" href="#">
<span class="material-symbols-outlined mb-0.5" data-icon="person">person</span>
<span class="font-plus-jakarta text-[10px] tracking-tight">我的</span>
</a>
</nav>
</body></html>
