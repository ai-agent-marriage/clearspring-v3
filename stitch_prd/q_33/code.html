<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&amp;family=Plus+Jakarta_Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-variant": "#e3e2de",
                    "secondary-fixed-dim": "#e0c64b",
                    "error-container": "#ffdad6",
                    "on-background": "#1b1c19",
                    "on-tertiary": "#ffffff",
                    "on-primary": "#ffffff",
                    "on-error": "#ffffff",
                    "inverse-surface": "#30312e",
                    "surface-container-low": "#f5f4ef",
                    "on-tertiary-fixed": "#291801",
                    "surface-container-highest": "#e3e2de",
                    "outline-variant": "#c3c8c1",
                    "surface-tint": "#506354",
                    "on-secondary-fixed-variant": "#534600",
                    "secondary-container": "#fee264",
                    "primary-fixed-dim": "#b7ccb9",
                    "on-primary-fixed-variant": "#394b3d",
                    "on-primary-fixed": "#0e1f13",
                    "on-error-container": "#93000a",
                    "tertiary-container": "#6d5435",
                    "inverse-on-surface": "#f2f1ec",
                    "inverse-primary": "#b7ccb9",
                    "error": "#ba1a1a",
                    "surface-container-lowest": "#ffffff",
                    "surface-bright": "#faf9f4",
                    "background": "#faf9f4",
                    "on-surface": "#1b1c19",
                    "tertiary": "#533d20",
                    "primary-container": "#4a5d4e",
                    "primary": "#334537",
                    "on-tertiary-container": "#ebcaa3",
                    "surface-dim": "#dbdad5",
                    "surface": "#faf9f4",
                    "on-secondary-fixed": "#211b00",
                    "on-tertiary-fixed-variant": "#594325",
                    "on-surface-variant": "#434843",
                    "outline": "#737872",
                    "on-secondary-container": "#756400",
                    "on-secondary": "#ffffff",
                    "tertiary-fixed": "#ffddb6",
                    "surface-container": "#efeee9",
                    "surface-container-high": "#e9e8e3",
                    "secondary": "#6e5e00",
                    "tertiary-fixed-dim": "#e2c19b",
                    "secondary-fixed": "#fee264",
                    "primary-fixed": "#d3e8d5",
                    "on-primary-container": "#c0d5c2"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Noto Serif"],
                    "body": ["Plus Jakarta Sans"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .serif-font { font-family: 'Noto Serif', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container text-on-surface min-h-screen pb-40">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-stone-50/40 dark:bg-stone-950/40 backdrop-blur-xl shadow-[0_12px_40px_rgba(74,93,78,0.06)] flex items-center justify-between px-6 h-16 w-full">
<button class="hover:bg-[#4A5D4E]/10 transition-colors rounded-full p-2 scale-95 duration-200 ease-in-out">
<span class="material-symbols-outlined text-[#334537] dark:text-[#FAF9F4]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Noto_Serif'] text-lg tracking-wide text-[#334537] dark:text-[#FAF9F4] font-bold">机构入驻申请</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="pt-24 px-5 max-w-2xl mx-auto space-y-8">
<!-- Intro Section with Ink Wash Aesthetic -->
<section class="relative overflow-hidden rounded-xl p-8 bg-surface-container-low mb-8">
<div class="absolute inset-0 opacity-10 pointer-events-none" style="background: radial-gradient(circle at 20% 30%, #4A5D4E 0%, transparent 70%);"></div>
<h2 class="serif-font text-2xl text-primary font-bold mb-2">开启您的修行合作之旅</h2>
<p class="text-on-surface-variant text-sm leading-relaxed">请填写以下真实有效的信息，我们将于3-5个工作日内完成审核。宁静致远，共修福报。</p>
</section>
<!-- Form Section 1: Basic Info -->
<section class="bg-surface-container-lowest p-6 rounded-xl shadow-[0_4px_20px_rgba(74,93,78,0.02)] space-y-6">
<div class="flex items-center space-x-2 border-l-4 border-primary pl-3 mb-4">
<h3 class="serif-font text-lg font-bold text-primary">机构基础信息</h3>
</div>
<div class="space-y-5">
<div class="group">
<label class="block text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider">
                        机构全称 <span class="text-error">*</span>
</label>
<input class="w-full bg-surface-container-high border-none rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary-container text-on-surface transition-all" placeholder="请输入机构完整官方名称" type="text"/>
</div>
<div class="group">
<label class="block text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider">
                        统一社会信用代码 <span class="text-error">*</span>
</label>
<input class="w-full bg-surface-container-high border-none rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary-container text-on-surface transition-all" placeholder="18位社会信用代码" type="text"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="group">
<label class="block text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider">
                            成立时间 <span class="text-error">*</span>
</label>
<input class="w-full bg-surface-container-high border-none rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary-container text-on-surface transition-all" type="date"/>
</div>
<div class="group">
<label class="block text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider">
                            机构类型 <span class="text-error">*</span>
</label>
<select class="w-full bg-surface-container-high border-none rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary-container text-on-surface transition-all">
<option>佛教文化机构</option>
<option>慈善公益组织</option>
<option>护生放生中心</option>
</select>
</div>
</div>
<div class="group">
<label class="block text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider">
                        机构地址 <span class="text-error">*</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-3.5 text-outline text-sm" data-icon="location_on">location_on</span>
<input class="w-full bg-surface-container-high border-none rounded-lg pl-10 pr-4 py-3 focus:ring-2 focus:ring-primary-container text-on-surface transition-all" placeholder="省/市/区/详细地址" type="text"/>
</div>
</div>
</div>
</section>
<!-- Form Section 2: Contact Info -->
<section class="bg-surface-container-lowest p-6 rounded-xl shadow-[0_4px_20px_rgba(74,93,78,0.02)] space-y-6">
<div class="flex items-center space-x-2 border-l-4 border-primary pl-3 mb-4">
<h3 class="serif-font text-lg font-bold text-primary">联系人信息</h3>
</div>
<div class="space-y-5">
<div class="grid grid-cols-2 gap-4">
<div class="group">
<label class="block text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider">
                            联系人姓名 <span class="text-error">*</span>
</label>
<input class="w-full bg-surface-container-high border-none rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary-container text-on-surface transition-all" placeholder="经办人姓名" type="text"/>
</div>
<div class="group">
<label class="block text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider">
                            联系电话 <span class="text-error">*</span>
</label>
<input class="w-full bg-surface-container-high border-none rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary-container text-on-surface transition-all" placeholder="11位手机号码" type="tel"/>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="group">
<label class="block text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider">
                            法人姓名 <span class="text-error">*</span>
</label>
<input class="w-full bg-surface-container-high border-none rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary-container text-on-surface transition-all" placeholder="法定代表人姓名" type="text"/>
</div>
<div class="group">
<label class="block text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider">
                            法人身份证号
                        </label>
<input class="w-full bg-surface-container-high border-none rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary-container text-on-surface transition-all" placeholder="18位身份证号" type="text"/>
</div>
</div>
</div>
</section>
<!-- Form Section 3: Qualifications Upload -->
<section class="bg-surface-container-lowest p-6 rounded-xl shadow-[0_4px_20px_rgba(74,93,78,0.02)] space-y-6">
<div class="flex items-center space-x-2 border-l-4 border-primary pl-3 mb-4">
<h3 class="serif-font text-lg font-bold text-primary">资质文件上传</h3>
</div>
<div class="grid grid-cols-2 gap-4">
<!-- Upload Card 1 -->
<div class="space-y-2">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider">营业执照 <span class="text-error">*</span></label>
<div class="aspect-[4/3] bg-surface-container-low rounded-xl border-2 border-dashed border-outline-variant hover:border-primary-container transition-colors flex flex-col items-center justify-center cursor-pointer group">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors text-3xl mb-2" data-icon="add_a_photo">add_a_photo</span>
<span class="text-[10px] text-outline-variant font-medium">点击上传</span>
</div>
</div>
<!-- Upload Card 2 -->
<div class="space-y-2">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider">护生资质 <span class="text-error">*</span></label>
<div class="aspect-[4/3] bg-surface-container-low rounded-xl border-2 border-dashed border-outline-variant hover:border-primary-container transition-colors flex flex-col items-center justify-center cursor-pointer group">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors text-3xl mb-2" data-icon="verified_user">verified_user</span>
<span class="text-[10px] text-outline-variant font-medium">点击上传</span>
</div>
</div>
<!-- Upload Card 3 -->
<div class="space-y-2">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider">水域协议 <span class="text-error">*</span></label>
<div class="aspect-[4/3] bg-surface-container-low rounded-xl border-2 border-dashed border-outline-variant hover:border-primary-container transition-colors flex flex-col items-center justify-center cursor-pointer group">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors text-3xl mb-2" data-icon="waves">waves</span>
<span class="text-[10px] text-outline-variant font-medium">点击上传</span>
</div>
</div>
<!-- Upload Card 4 -->
<div class="space-y-2">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider">法人身份证明</label>
<div class="aspect-[4/3] bg-surface-container-low rounded-xl border-2 border-dashed border-outline-variant hover:border-primary-container transition-colors flex flex-col items-center justify-center cursor-pointer group">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors text-3xl mb-2" data-icon="badge">badge</span>
<span class="text-[10px] text-outline-variant font-medium">点击上传</span>
</div>
</div>
</div>
<p class="text-[10px] text-outline-variant italic leading-relaxed">支持JPG/PNG格式，文件需清晰可见，大小不超过5MB。</p>
</section>
<!-- Compliance Check -->
<section class="flex items-start space-x-3 px-2 py-4">
<input class="mt-1 h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary-container" id="compliance" type="checkbox"/>
<label class="text-xs text-on-surface-variant leading-relaxed" for="compliance">
                我承诺所提交的信息与资质真实有效，严格遵守国家相关法律法规，如有虚假愿承担全部法律责任。
            </label>
</section>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-20 left-0 w-full px-5 py-4 bg-surface/80 backdrop-blur-md z-40">
<button class="w-full bg-primary-container text-on-primary-container font-semibold py-4 rounded-xl shadow-lg active:scale-95 transition-transform">
            提交申请
        </button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full h-20 bg-[#FAF9F4]/80 dark:bg-stone-900/80 backdrop-blur-md flex justify-around items-center px-4 pb-4 z-50 rounded-t-lg shadow-[0_-4px_20px_rgba(74,93,78,0.04)]">
<div class="flex flex-col items-center justify-center text-[#4A5D4E]/70 hover:opacity-80 transition-opacity active:scale-90 transition-transform cursor-pointer">
<span class="material-symbols-outlined" data-icon="library_music">library_music</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] tracking-tight">梵音</span>
</div>
<div class="flex flex-col items-center justify-center text-[#4A5D4E]/70 hover:opacity-80 transition-opacity active:scale-90 transition-transform cursor-pointer">
<span class="material-symbols-outlined" data-icon="menu_book">menu_book</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] tracking-tight">禅理</span>
</div>
<!-- Active: 我的 -->
<div class="flex flex-col items-center justify-center bg-[#C9B037] text-white rounded-xl px-5 py-1.5 active:scale-90 transition-transform cursor-pointer">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] tracking-tight">我的</span>
</div>
</nav>
</body></html>
