<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#0e1f13",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#b7ccb9",
                        "tertiary-container": "#6d5435",
                        "inverse-on-surface": "#f2f1ec",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "background": "#faf9f4",
                        "on-surface": "#1b1c19",
                        "surface-bright": "#faf9f4",
                        "on-background": "#1b1c19",
                        "surface-variant": "#e3e2de",
                        "secondary-fixed-dim": "#e0c64b",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#291801",
                        "surface-container-highest": "#e3e2de",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#30312e",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f5f4ef",
                        "outline-variant": "#c3c8c1",
                        "on-primary-fixed-variant": "#394b3d",
                        "primary-fixed-dim": "#b7ccb9",
                        "surface-tint": "#506354",
                        "on-secondary-fixed-variant": "#534600",
                        "secondary-container": "#fee264",
                        "on-secondary-container": "#756400",
                        "outline": "#737872",
                        "surface-container-high": "#e9e8e3",
                        "secondary": "#6e5e00",
                        "on-secondary": "#ffffff",
                        "surface-container": "#efeee9",
                        "tertiary-fixed": "#ffddb6",
                        "primary-fixed": "#d3e8d5",
                        "secondary-fixed": "#fee264",
                        "tertiary-fixed-dim": "#e2c19b",
                        "on-primary-container": "#c0d5c2",
                        "primary-container": "#4a5d4e",
                        "primary": "#334537",
                        "tertiary": "#533d20",
                        "surface-dim": "#dbdad5",
                        "surface": "#faf9f4",
                        "on-tertiary-container": "#ebcaa3",
                        "on-secondary-fixed": "#211b00",
                        "on-tertiary-fixed-variant": "#594325",
                        "on-surface-variant": "#434843"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif SC", "serif"],
                        "body": ["Plus Jakarta Sans", "sans-serif"],
                        "label": ["Plus Jakarta Sans", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .ink-wash-bg {
            background: linear-gradient(180deg, rgba(250, 249, 244, 0) 0%, rgba(239, 238, 233, 0.8) 100%),
                        radial-gradient(circle at 80% 20%, rgba(74, 93, 78, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 20% 80%, rgba(201, 176, 55, 0.03) 0%, transparent 50%);
        }
        .circular-progress {
            background: conic-gradient(#4a5d4e 162deg, #e3e2de 0deg);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background font-body text-on-background min-h-screen flex flex-col overflow-hidden selection:bg-secondary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#FAF9F4]/40 backdrop-blur-md flex justify-between items-center px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="hover:opacity-80 transition-opacity text-[#334537]">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
</div>
<h1 class="text-xl font-headline font-bold text-[#334537]">清如</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Area -->
<main class="flex-1 mt-16 mb-20 relative flex flex-col items-center justify-center ink-wash-bg px-8">
<!-- Poetic Intro Overlay (Editorial Voice) -->
<div class="absolute top-12 left-8 max-w-[200px] opacity-40">
<p class="font-headline text-lg leading-relaxed text-primary">
                听风起，<br/>
                看云落，<br/>
                梵音如昨。
            </p>
</div>
<!-- Large Circular Progress Bar -->
<div class="relative w-72 h-72 md:w-80 md:h-80 flex items-center justify-center">
<!-- Outer Ring (Conic Gradient via background class) -->
<div class="circular-progress absolute inset-0 rounded-full flex items-center justify-center shadow-[0_12px_40px_rgba(74,93,78,0.06)]">
<!-- Inner "Xuan Paper" Mask -->
<div class="w-[96%] h-[96%] bg-background rounded-full flex flex-col items-center justify-center">
<!-- Album/Subject Image -->
<div class="w-full h-full rounded-full overflow-hidden opacity-10 absolute inset-0">
<img class="w-full h-full object-cover" data-alt="Soft watercolor ink painting of a single lotus flower blooming in a misty mountain pond with ethereal morning light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC997AAOfpAe0QzeGgugYNrgn8EoBlO2z87qikUr3Tse7MB4NPcw1ybPDIoSUCUReaXIn58-EfJRJt88J407ctoxF9XK0wwzhctacXTeuYz7sA6KBGGjiC3DDc8Naek0JF7znq9lFZLiIgTE-vXYUw_JghnL8lrHzrx96x5jPH7OrHMTBhfDQgYPPNeVGU8mp4w-QlgKY5FJmBJiyz330RypwzdYbfMlVZ2n-MxiewwhDJeN3JL7gLDwXw87lD5i3pg-R3xlVRaY4rE"/>
</div>
<!-- Time Indicator -->
<div class="z-10 text-center">
<span class="block text-4xl font-headline font-bold text-primary tracking-wider mb-2">03:45</span>
<div class="h-[1px] w-12 bg-outline-variant/30 mx-auto mb-2"></div>
<span class="block text-sm font-label uppercase tracking-widest text-outline">08:20</span>
</div>
</div>
</div>
</div>
<!-- Audio Metadata -->
<section class="mt-12 text-center">
<h2 class="text-3xl font-headline text-primary mb-3">般若心经</h2>
<div class="flex items-center justify-center gap-3">
<span class="inline-block px-3 py-1 bg-surface-container-high rounded-full text-xs font-label text-outline tracking-wider">ZEN MODE</span>
<span class="inline-block px-3 py-1 bg-secondary-container/20 text-secondary text-xs font-label rounded-full tracking-wider">HD 24-bit</span>
</div>
</section>
<!-- Controls Section -->
<section class="w-full max-w-sm mt-12 flex flex-col items-center">
<!-- Main Playback Controls -->
<div class="flex items-center justify-between w-full mb-10 px-4">
<button class="text-primary/60 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-3xl">shuffle</span>
</button>
<div class="flex items-center gap-8">
<button class="text-primary hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-4xl">skip_previous</span>
</button>
<!-- Center Play Button (Pebble style) -->
<button class="w-20 h-20 bg-primary-container text-on-primary rounded-full shadow-lg flex items-center justify-center hover:scale-95 duration-200 transition-transform">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="text-primary hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-4xl">skip_next</span>
</button>
</div>
<button class="text-primary/60 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-3xl">repeat</span>
</button>
</div>
<!-- Volume Slider -->
<div class="w-full flex items-center gap-4 px-2">
<span class="material-symbols-outlined text-outline text-xl">volume_down</span>
<div class="flex-1 h-1 bg-surface-container-highest rounded-full relative group cursor-pointer">
<div class="absolute left-0 top-0 h-full w-2/3 bg-primary rounded-full"></div>
<div class="absolute left-2/3 top-1/2 -translate-y-1/2 w-4 h-4 bg-background border-2 border-primary rounded-full shadow-sm"></div>
</div>
<span class="material-symbols-outlined text-outline text-xl">volume_up</span>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 pb-safe px-4 bg-[#FAF9F4] shadow-[0_-4px_20px_rgba(74,93,78,0.06)] rounded-t-lg z-50">
<a class="flex flex-col items-center justify-center text-[#4A5D4E] font-semibold scale-95 duration-200" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">music_note</span>
<span class="text-xs font-label">梵音</span>
</a>
<a class="flex flex-col items-center justify-center text-[#334537]/40 hover:text-[#4A5D4E] transition-colors scale-95 duration-200" href="#">
<span class="material-symbols-outlined mb-1">auto_stories</span>
<span class="text-xs font-label">禅理</span>
</a>
<a class="flex flex-col items-center justify-center text-[#334537]/40 hover:text-[#4A5D4E] transition-colors scale-95 duration-200" href="#">
<span class="material-symbols-outlined mb-1">person</span>
<span class="text-xs font-label">我的</span>
</a>
</nav>
<!-- Floating Audio Enhancements Card (Subtle Layering) -->
<div class="fixed right-6 bottom-32 flex flex-col gap-4">
<button class="w-12 h-12 bg-surface-container-lowest text-primary rounded-full shadow-[0_12px_40px_rgba(74,93,78,0.06)] flex items-center justify-center hover:bg-surface-bright transition-colors border border-outline-variant/15">
<span class="material-symbols-outlined">equalizer</span>
</button>
<button class="w-12 h-12 bg-surface-container-lowest text-primary rounded-full shadow-[0_12px_40px_rgba(74,93,78,0.06)] flex items-center justify-center hover:bg-surface-bright transition-colors border border-outline-variant/15">
<span class="material-symbols-outlined">timer</span>
</button>
</div>
</body></html>
