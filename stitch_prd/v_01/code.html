<!DOCTYPE html>

<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .serif-title { font-family: 'Noto Serif SC', serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .ink-wash-bg {
            background: linear-gradient(135deg, rgba(74, 93, 78, 0.05) 0%, rgba(250, 249, 244, 0) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-6 h-16 w-full fixed top-0 z-50 bg-[#4A5D4E] shadow-sm bg-opacity-90 backdrop-blur-md">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-white cursor-pointer hover:bg-white/10 p-2 rounded-full transition-colors" data-icon="menu">menu</span>
<h1 class="text-white text-lg font-bold serif-title">志愿者工作台</h1>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-white cursor-pointer hover:bg-white/10 p-2 rounded-full transition-colors" data-icon="notifications">notifications</span>
</div>
</header>
<main class="pt-20 px-4 space-y-6 max-w-2xl mx-auto">
<!-- User Profile Card -->
<section class="bg-surface-container-lowest p-6 rounded-3xl shadow-[0_12px_40px_rgba(74,93,78,0.06)] flex items-center gap-4">
<div class="w-16 h-16 rounded-full overflow-hidden bg-surface-container">
<img alt="Volunteer Avatar" class="w-full h-full object-cover" data-alt="Close-up portrait of a serene looking person with a gentle smile in soft natural lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuChXSz-R2lr_eOcB4kQALyc9s6adh3Ft_j5_GqKD8tPbHb7RmbsIJo34TkA_CmMKUKccD9j5SszoQwyhO83TrfVvpbV6QABUNKGZvP5DGjyv2GUwg1m6CAj1T8g05v44feTH2mlyISALfeCTF8gpAEJq4WfdhWKstV7UCsK1TddDAJIdGWh92aV7SRq9HyZThuiktJJNipIbIs5M0_rBMj_-vmSxrqWxRZ5cp-tyNk8kvDuKSk6Ok22RwNQ4cfTp_1UR0mRCQ74KN3X"/>
</div>
<div class="flex-1">
<div class="flex items-center gap-2 mb-1">
<span class="text-xl font-bold text-primary">陈静修</span>
<span class="bg-primary-container text-on-primary-container text-[10px] px-2 py-0.5 rounded-full font-medium">资深志愿者</span>
</div>
<div class="flex items-center gap-2">
<div class="flex items-center gap-1 text-secondary font-medium text-sm">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">verified</span>
<span>实名认证已通过</span>
</div>
</div>
</div>
</section>
<!-- Data Dashboard 2x2 Grid -->
<section class="grid grid-cols-2 gap-4">
<div class="bg-surface-container-low p-5 rounded-2xl ink-wash-bg">
<p class="text-on-surface-variant text-xs mb-1">待执行任务</p>
<div class="flex items-baseline gap-1">
<span class="text-3xl font-bold serif-title text-primary">04</span>
<span class="text-[10px] text-on-surface-variant">项</span>
</div>
</div>
<div class="bg-surface-container-low p-5 rounded-2xl ink-wash-bg">
<p class="text-on-surface-variant text-xs mb-1">已完成任务</p>
<div class="flex items-baseline gap-1">
<span class="text-3xl font-bold serif-title text-primary">128</span>
<span class="text-[10px] text-on-surface-variant">项</span>
</div>
</div>
<div class="bg-surface-container-low p-5 rounded-2xl ink-wash-bg">
<p class="text-on-surface-variant text-xs mb-1">累计服务时长</p>
<div class="flex items-baseline gap-1">
<span class="text-3xl font-bold serif-title text-primary">352</span>
<span class="text-[10px] text-on-surface-variant">小时</span>
</div>
</div>
<div class="bg-surface-container-low p-5 rounded-2xl ink-wash-bg">
<p class="text-on-surface-variant text-xs mb-1">任务执行率</p>
<div class="flex items-baseline gap-1">
<span class="text-3xl font-bold serif-title text-primary">98.5</span>
<span class="text-[10px] text-on-surface-variant">%</span>
</div>
</div>
</section>
<!-- Quick Access Buttons -->
<section class="space-y-3">
<button class="w-full flex items-center justify-between p-4 bg-surface-container-high rounded-2xl hover:bg-surface-container-highest transition-colors group">
<div class="flex items-center gap-3">
<div class="bg-primary/10 p-2 rounded-xl text-primary group-active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="assignment_ind">assignment_ind</span>
</div>
<span class="font-medium text-on-surface">任务广场</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 bg-surface-container-high rounded-2xl hover:bg-surface-container-highest transition-colors group">
<div class="flex items-center gap-3">
<div class="bg-primary/10 p-2 rounded-xl text-primary group-active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="history_edu">history_edu</span>
</div>
<span class="font-medium text-on-surface">荣誉档案</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 bg-surface-container-high rounded-2xl hover:bg-surface-container-highest transition-colors group">
<div class="flex items-center gap-3">
<div class="bg-primary/10 p-2 rounded-xl text-primary group-active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="settings_accessibility">settings_accessibility</span>
</div>
<span class="font-medium text-on-surface">志愿者手册</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
</section>
<!-- Latest Tasks List -->
<section class="space-y-4">
<div class="flex justify-between items-end px-2">
<h3 class="serif-title text-xl text-primary">最新任务</h3>
<span class="text-xs text-outline cursor-pointer hover:text-primary transition-colors">查看全部</span>
</div>
<div class="bg-surface-container-lowest p-5 rounded-3xl space-y-4 shadow-sm border border-outline-variant/15">
<div class="flex justify-between items-start">
<div class="space-y-1">
<h4 class="font-bold text-on-surface">协助早课祈福仪式</h4>
<div class="flex items-center gap-2 text-xs text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="schedule">schedule</span>
<span>明日 06:30 - 08:30</span>
</div>
<div class="flex items-center gap-2 text-xs text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="location_on">location_on</span>
<span>大雄宝殿</span>
</div>
</div>
<span class="bg-secondary-container text-on-secondary-container text-[10px] px-2 py-0.5 rounded-full font-bold">高急迫性</span>
</div>
<div class="flex items-center justify-between pt-2">
<div class="text-xs text-on-surface-variant">
                        需人数: <span class="text-primary font-bold">2/5</span>
</div>
<button class="bg-primary-container text-white px-6 py-2 rounded-xl text-sm font-bold active:scale-95 transition-transform">去承接</button>
</div>
</div>
<div class="bg-surface-container-lowest p-5 rounded-3xl space-y-4 shadow-sm border border-outline-variant/15 opacity-80">
<div class="flex justify-between items-start">
<div class="space-y-1">
<h4 class="font-bold text-on-surface">图书馆古籍整理</h4>
<div class="flex items-center gap-2 text-xs text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="schedule">schedule</span>
<span>周六 14:00 - 17:00</span>
</div>
<div class="flex items-center gap-2 text-xs text-on-surface-variant">
<span class="material-symbols-outlined text-sm" data-icon="location_on">location_on</span>
<span>经堂二楼</span>
</div>
</div>
</div>
<div class="flex items-center justify-between pt-2">
<div class="text-xs text-on-surface-variant">
                        需人数: <span class="text-primary font-bold">0/3</span>
</div>
<button class="bg-primary-container text-white px-6 py-2 rounded-xl text-sm font-bold active:scale-95 transition-transform">去承接</button>
</div>
</div>
</section>
<!-- Switch Perspective Button -->
<section class="pt-4">
<button class="w-full py-3 border-2 border-outline-variant rounded-2xl text-outline font-medium flex items-center justify-center gap-2 active:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" data-icon="sync_alt">sync_alt</span>
                切换为祈福者视角
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 border-t border-[#4A5D4E]/10 bg-[#FAF9F4] dark:bg-[#1A1C19] rounded-t-2xl">
<a class="flex flex-col items-center justify-center text-[#4A5D4E] opacity-60 hover:bg-[#EFEEE9] px-4 py-1 rounded-xl transition-all" href="#">
<span class="material-symbols-outlined" data-icon="library_music">library_music</span>
<span class="text-[10px] font-body tracking-wide mt-1">梵音</span>
</a>
<a class="flex flex-col items-center justify-center text-[#4A5D4E] opacity-60 hover:bg-[#EFEEE9] px-4 py-1 rounded-xl transition-all" href="#">
<span class="material-symbols-outlined" data-icon="menu_book">menu_book</span>
<span class="text-[10px] font-body tracking-wide mt-1">禅理</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#C9B037] text-white rounded-xl px-4 py-1 transition-all scale-90 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-[10px] font-body tracking-wide mt-1">我的</span>
</a>
</nav>
