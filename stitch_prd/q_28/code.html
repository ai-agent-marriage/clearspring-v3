        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;

            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #faf9f4;
            color: #1b1c19;
        }
        .serif-text {
            font-family: 'Noto Serif SC', serif;
        }
        .ink-wash-overlay {
            background: linear-gradient(135deg, rgba(74, 93, 78, 0.03) 0%, rgba(250, 249, 244, 0) 100%);
        }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#334537] dark:bg-[#1a241c] flex items-center px-4 h-16 w-full shadow-none transition-all">
<div class="flex items-center gap-4 w-full">
<span class="material-symbols-outlined text-[#FAF9F4] cursor-pointer hover:opacity-80 transition-opacity" data-icon="arrow_back">arrow_back</span>
<h1 class="text-[#FAF9F4] text-lg font-bold serif-text tracking-wide">账号与安全</h1>
</div>
</header>
<main class="pt-24 px-6 max-w-2xl mx-auto space-y-6">
<!-- Introduction/Status -->
<div class="mb-8 space-y-2">
<h2 class="serif-text text-2xl text-primary font-bold">安全管理</h2>
<p class="text-on-surface-variant/70 text-sm">在这里您可以管理账号的连接方式与认证状态。</p>
</div>
<!-- Account Info List: Card Style -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0_12px_40px_rgba(74,93,78,0.06)] overflow-hidden">
<!-- WeChat Binding -->
<div class="flex items-center justify-between p-5 border-b border-outline-variant/10">
<div class="flex flex-col">
<span class="text-on-surface font-semibold">微信绑定</span>
<span class="text-on-surface-variant text-xs mt-0.5">微信用户A</span>
</div>
<button class="px-4 py-1.5 border border-primary text-primary text-sm rounded-lg hover:bg-primary/5 transition-colors active:scale-95 duration-150">
                    更换绑定
                </button>
</div>
<!-- Real Name Auth -->
<div class="flex items-center justify-between p-5 border-b border-outline-variant/10">
<span class="text-on-surface font-semibold">实名认证</span>
<div class="flex items-center gap-1 bg-[#38A169]/10 px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-[#38A169] text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-[#38A169] text-xs font-bold">已认证</span>
</div>
</div>
<!-- Phone Number -->
<div class="flex items-center justify-between p-5 border-b border-outline-variant/10">
<div class="flex flex-col">
<span class="text-on-surface font-semibold">手机号</span>
<span class="text-on-surface-variant text-xs mt-0.5">138****8888</span>
</div>
<button class="px-4 py-1.5 border border-primary text-primary text-sm rounded-lg hover:bg-primary/5 transition-colors active:scale-95 duration-150">
                    更换
                </button>
</div>
<!-- Account Deletion -->
<div class="flex items-center justify-between p-5 hover:bg-error-container/5 cursor-pointer transition-colors active:scale-[0.98] duration-150">
<span class="text-error font-semibold">账号注销</span>
<span class="material-symbols-outlined text-outline-variant" data-icon="chevron_right">chevron_right</span>
</div>
</section>
<!-- Safety Tips Area -->
<section class="bg-surface-container-low rounded-xl p-6 border-none ink-wash-overlay">
<div class="flex gap-3">
<span class="material-symbols-outlined text-primary/40" data-icon="shield">shield</span>
<div class="space-y-1">
<h3 class="text-primary font-bold text-sm">安全提示</h3>
<p class="text-on-surface-variant text-xs leading-relaxed">为了您的账号安全，请定期更换绑定信息。注销账号将永久清除所有修行数据且不可恢复。</p>
</div>
</div>
</section>
<!-- Aesthetic Separation Decor -->
<div class="flex justify-center py-10 opacity-20">
<div class="h-[1px] w-12 bg-primary"></div>
<div class="mx-4 text-primary text-xs serif-text">静心守正</div>
<div class="h-[1px] w-12 bg-primary"></div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-2xl bg-[#FAF9F4]/40 dark:bg-[#1a241c]/40 backdrop-blur-xl shadow-[0_-4px_20px_rgba(74,93,78,0.06)] flex justify-around items-center px-6 pb-6 pt-3">
<!-- Tab 1: 梵音 -->
<div class="flex flex-col items-center justify-center text-[#334537]/60 dark:text-[#FAF9F4]/60 hover:bg-[#EFEEE9] dark:hover:bg-white/10 p-2 rounded-xl transition-all cursor-pointer">
<span class="material-symbols-outlined text-xl" data-icon="library_music">library_music</span>
<span class="text-xs font-sans tracking-tight mt-1">梵音</span>
</div>
<!-- Tab 2: 禅理 -->
<div class="flex flex-col items-center justify-center text-[#334537]/60 dark:text-[#FAF9F4]/60 hover:bg-[#EFEEE9] dark:hover:bg-white/10 p-2 rounded-xl transition-all cursor-pointer">
<span class="material-symbols-outlined text-xl" data-icon="self_improvement">self_improvement</span>
<span class="text-xs font-sans tracking-tight mt-1">禅理</span>
</div>
<!-- Tab 3: 我的 (Active) -->
<div class="flex flex-col items-center justify-center bg-[#C9B037] text-[#FAF9F4] rounded-xl px-4 py-1.5 transition-all scale-95 duration-200 ease-out cursor-pointer shadow-sm">
<span class="material-symbols-outlined text-xl" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-xs font-sans tracking-tight mt-0.5 font-medium">我的</span>
</div>
</nav>
