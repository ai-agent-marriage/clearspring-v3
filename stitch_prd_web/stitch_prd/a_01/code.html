<div class="absolute inset-0 ink-wash-gradient"></div>
</div>
<div class="relative z-10 max-w-lg text-left">
<div class="flex items-center gap-4 mb-12">
<span class="material-symbols-outlined text-on-primary-container text-4xl" data-icon="temp_preferences_custom">temp_preferences_custom</span>
<h1 class="text-4xl font-bold tracking-tighter text-surface serif-text">清如</h1>
</div>
<div class="space-y-6">
<h2 class="text-5xl serif-text leading-tight text-white opacity-90">梵音·禅理·我的</h2>
<p class="text-on-primary-container text-xl font-light tracking-wide max-w-md">
                        在数字世界的喧嚣中，我们为您打造一处静谧之所。通过正念与科学的交织，回归本质的清澈。
                    </p>
</div>
<div class="mt-24 flex gap-12 text-on-primary-container/60 text-sm tracking-[0.2em] font-medium">
<span class="border-b border-on-primary-container/20 pb-2">专注</span>
<span class="border-b border-on-primary-container/20 pb-2">内省</span>
<span class="border-b border-on-primary-container/20 pb-2">智慧</span>
</div>
</div>
</section>
<!-- Right Side: Login Interaction Canvas -->
<section class="flex-grow flex items-center justify-center bg-surface px-8 py-24 relative">
<div class="w-full max-auto max-w-[440px] relative">
<!-- QR Code Toggle Anchor -->
<div class="absolute -top-4 -right-4 z-20">
<button class="p-3 bg-surface-container hover:bg-surface-container-high transition-colors rounded-xl flex items-center justify-center group">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" data-icon="qr_code_2">qr_code_2</span>
</button>
</div>
<div class="space-y-12">
<header class="space-y-2">
<h3 class="text-3xl font-bold serif-text text-primary tracking-tight">后台登录</h3>
<p class="text-on-surface-variant/70 text-sm font-medium tracking-wide">请输入您的凭据以进入管理空间</p>
</header>
<form class="space-y-8">
<div class="space-y-6">
<!-- Input: Account -->
<div class="relative group">
<label class="block text-[10px] uppercase tracking-widest text-on-surface-variant font-bold mb-1 ml-1 opacity-60 group-focus-within:opacity-100 transition-opacity">管理员账号</label>
<div class="flex items-center gap-3 bg-surface-container-low px-5 py-4 rounded-xl focus-within:bg-white focus-within:whisper-shadow transition-all duration-300">
<span class="material-symbols-outlined text-primary/40 text-xl" data-icon="account_circle">account_circle</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-primary placeholder:text-outline-variant font-medium" placeholder="手机号或邮箱" type="text"/>
</div>
</div>
<!-- Input: Password -->
<div class="relative group">
<div class="flex justify-between items-end mb-1 px-1">
<label class="block text-[10px] uppercase tracking-widest text-on-surface-variant font-bold opacity-60 group-focus-within:opacity-100 transition-opacity">安全密码</label>
<a class="text-[10px] font-bold text-secondary-fixed-dim hover:text-secondary transition-colors uppercase tracking-wider" href="#">忘记密码?</a>
</div>
<div class="flex items-center gap-3 bg-surface-container-low px-5 py-4 rounded-xl focus-within:bg-white focus-within:whisper-shadow transition-all duration-300">
<span class="material-symbols-outlined text-primary/40 text-xl" data-icon="lock">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-primary placeholder:text-outline-variant tracking-widest" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined text-primary/40 text-xl cursor-pointer hover:text-primary transition-colors" data-icon="visibility_off">visibility_off</span>
</div>
</div>
</div>
<!-- MFA Checkbox -->
<div class="flex items-center gap-3 px-1 group cursor-pointer">
<div class="relative flex items-center justify-center h-5 w-5 border-2 border-outline-variant rounded-md group-hover:border-primary transition-colors">
<input class="opacity-0 absolute inset-0 cursor-pointer peer" type="checkbox"/>
<div class="h-2 w-2 bg-primary rounded-sm opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="text-xs text-on-surface-variant font-medium">这是一台受信任的设备 (30天内保持登录)</span>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full bg-primary-container text-on-primary py-5 rounded-xl font-bold tracking-widest hover:bg-primary transition-all active:scale-[0.98] duration-300 whisper-shadow flex items-center justify-center gap-3">
<span>立即登录</span>
<span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<footer class="text-center pt-8">
<p class="text-xs text-on-surface-variant/50 font-medium">系统由 <span class="text-primary/70">Qingru Zen Cloud</span> 提供技术支持</p>

</div>
</div>
