<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline-variant": "#c3c8c1",
                    "on-tertiary": "#ffffff",
                    "on-surface": "#1b1c19",
                    "on-secondary": "#ffffff",
                    "surface-container-high": "#e9e8e3",
                    "secondary-fixed-dim": "#e0c64b",
                    "primary-container": "#4a5d4e",
                    "on-error-container": "#93000a",
                    "on-secondary-fixed": "#211b00",
                    "tertiary-container": "#6d5435",
                    "on-background": "#1b1c19",
                    "surface": "#EFEEE9",
                    "background": "#EFEEE9",
                    "surface-container-highest": "#e3e2de",
                    "primary-fixed-dim": "#b7ccb9",
                    "inverse-on-surface": "#f2f1ec",
                    "surface-variant": "#e3e2de",
                    "on-secondary-container": "#756400",
                    "on-primary-container": "#c0d5c2",
                    "on-error": "#ffffff",
                    "tertiary-fixed": "#ffddb6",
                    "on-tertiary-container": "#ebcaa3",
                    "on-primary-fixed": "#0e1f13",
                    "secondary-container": "#fee264",
                    "surface-container-lowest": "#ffffff",
                    "tertiary-fixed-dim": "#e2c19b",
                    "surface-bright": "#faf9f4",
                    "secondary-fixed": "#fee264",
                    "on-tertiary-fixed-variant": "#594325",
                    "error-container": "#ffdad6",
                    "secondary": "#6e5e00",
                    "inverse-surface": "#30312e",
                    "surface-container": "#efeee9",
                    "on-surface-variant": "#434843",
                    "on-tertiary-fixed": "#291801",
                    "on-primary": "#ffffff",
                    "surface-tint": "#506354",
                    "on-secondary-fixed-variant": "#534600",
                    "surface-container-low": "#f5f4ef",
                    "outline": "#737872",
                    "surface-dim": "#dbdad5",
                    "primary": "#334537",
                    "error": "#ba1a1a",
                    "tertiary": "#533d20",
                    "on-primary-fixed-variant": "#394b3d",
                    "inverse-primary": "#b7ccb9",
                    "primary-fixed": "#d3e8d5"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Noto Serif SC", "serif"],
                    "body": ["Plus Jakarta Sans", "sans-serif"],
                    "label": ["Plus Jakarta Sans", "sans-serif"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #EFEEE9; }
        .font-serif { font-family: 'Noto Serif SC', serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-8 py-6">
<div class="flex items-center gap-3">
<span class="font-serif text-2xl font-bold text-primary tracking-wider">祈福者</span>
</div>
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary/60 hover:bg-black/5 p-2 rounded-full transition-all duration-300">settings</button>
</div>
</header>
<main class="flex-grow pt-32 pb-32 px-8 max-w-lg mx-auto w-full flex flex-col">
<!-- Hero Branding Section -->
<section class="text-center mb-24">
<h1 class="font-serif text-5xl font-bold text-primary mb-6 tracking-widest">清如</h1>
<p class="font-serif text-xs text-primary/60 tracking-[0.4em] uppercase">积善成德   虚极静笃</p>
</section>
<!-- Function List (Minimalist Cards) -->
<section class="space-y-4 mb-20">
<!-- Entry 1 -->
<div class="bg-surface-container-lowest/50 border border-black/5 p-5 rounded-2xl flex items-center justify-between group cursor-pointer transition-all duration-300 hover:bg-surface-container-lowest">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-2xl">history</span>
<span class="text-[15px] font-medium text-on-surface tracking-wide">本地收听记录</span>
</div>
<span class="material-symbols-outlined text-black/10 group-hover:text-primary/30 transition-colors">chevron_right</span>
</div>
<!-- Entry 2 -->
<div class="bg-surface-container-lowest/50 border border-black/5 p-5 rounded-2xl flex items-center justify-between group cursor-pointer transition-all duration-300 hover:bg-surface-container-lowest">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-2xl">favorite</span>
<span class="text-[15px] font-medium text-on-surface tracking-wide">本地收藏夹</span>
</div>
<span class="material-symbols-outlined text-black/10 group-hover:text-primary/30 transition-colors">chevron_right</span>
</div>
<!-- Entry 3 -->
<div class="bg-surface-container-lowest/50 border border-black/5 p-5 rounded-2xl flex items-center justify-between group cursor-pointer transition-all duration-300 hover:bg-surface-container-lowest">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-2xl">eco</span>
<span class="text-[15px] font-medium text-on-surface tracking-wide">护生科普专区</span>
</div>
<span class="material-symbols-outlined text-black/10 group-hover:text-primary/30 transition-colors">chevron_right</span>
</div>
<!-- Entry 4 -->
<div class="bg-surface-container-lowest/50 border border-black/5 p-5 rounded-2xl flex items-center justify-between group cursor-pointer transition-all duration-300 hover:bg-surface-container-lowest">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-2xl">quiz</span>
<span class="text-[15px] font-medium text-on-surface tracking-wide">常见问题与反馈</span>
</div>
<span class="material-symbols-outlined text-black/10 group-hover:text-primary/30 transition-colors">chevron_right</span>
</div>
</section>
<!-- System Info/Footer -->
<footer class="mt-auto text-center space-y-6">
<div class="flex justify-center items-center gap-8">
<button class="text-[11px] text-primary/40 tracking-widest font-medium uppercase hover:text-primary transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-sm">settings</span>
                系统设置
            </button>
<button class="text-[11px] text-primary/40 tracking-widest font-medium uppercase hover:text-primary transition-colors">合规公示入口</button>
</div>
</footer>
</main>
<!-- Floating Action Button -->
<button class="fixed bottom-28 right-6 bg-primary text-on-primary w-14 h-14 rounded-full flex items-center justify-center shadow-lg shadow-primary/20 transition-all active:scale-90 z-40 group overflow-hidden">
<span class="material-symbols-outlined text-2xl">volunteer_activism</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full bg-white/60 backdrop-blur-xl flex justify-around items-center px-4 pb-8 pt-4 z-50 rounded-t-[32px] border-t border-black/[0.03]">
<div class="flex flex-col items-center justify-center text-primary/40 px-6 py-1 hover:text-primary transition-colors cursor-pointer">
<span class="material-symbols-outlined text-2xl">music_note</span>
<span class="text-[10px] tracking-widest mt-1 font-medium">梵音</span>
</div>
<div class="flex flex-col items-center justify-center text-primary/40 px-6 py-1 hover:text-primary transition-colors cursor-pointer">
<span class="material-symbols-outlined text-2xl">auto_stories</span>
<span class="text-[10px] tracking-widest mt-1 font-medium">禅理</span>
</div>
<div class="flex flex-col items-center justify-center text-primary px-6 py-1 transition-colors cursor-pointer">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-[10px] tracking-widest mt-1 font-bold">我的</span>
</div>
</nav>
</body></html>
