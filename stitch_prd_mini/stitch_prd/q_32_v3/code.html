<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&amp;family=Plus+Jakarta_Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline-variant": "#c3c8c1",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed": "#211b00",
                    "tertiary-fixed": "#ffddb6",
                    "primary-fixed-dim": "#b7ccb9",
                    "surface-dim": "#dbdad5",
                    "on-primary-fixed-variant": "#394b3d",
                    "on-tertiary-fixed": "#291801",
                    "inverse-on-surface": "#f2f1ec",
                    "on-background": "#1b1c19",
                    "on-tertiary": "#ffffff",
                    "surface-container-high": "#e9e8e3",
                    "secondary-fixed": "#fee264",
                    "primary-fixed": "#d3e8d5",
                    "on-tertiary-fixed-variant": "#594325",
                    "secondary": "#6e5e00",
                    "on-surface": "#1b1c19",
                    "background": "#faf9f4",
                    "surface": "#faf9f4",
                    "surface-container-low": "#f5f4ef",
                    "on-tertiary-container": "#ebcaa3",
                    "secondary-fixed-dim": "#e0c64b",
                    "primary": "#334537",
                    "on-secondary-fixed-variant": "#534600",
                    "surface-container": "#efeee9",
                    "surface-container-highest": "#e3e2de",
                    "error": "#ba1a1a",
                    "tertiary": "#533d20",
                    "outline": "#737872",
                    "inverse-primary": "#b7ccb9",
                    "on-error": "#ffffff",
                    "secondary-container": "#fee264",
                    "on-secondary-container": "#756400",
                    "tertiary-fixed-dim": "#e2c19b",
                    "surface-bright": "#faf9f4",
                    "on-error-container": "#93000a",
                    "surface-container-lowest": "#ffffff",
                    "surface-variant": "#e3e2de",
                    "surface-tint": "#506354",
                    "tertiary-container": "#6d5435",
                    "error-container": "#ffdad6",
                    "primary-container": "#4a5d4e",
                    "on-primary-container": "#c0d5c2",
                    "on-surface-variant": "#434843",
                    "inverse-surface": "#30312e",
                    "on-primary": "#ffffff",
                    "on-primary-fixed": "#0e1f13"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Noto Serif"],
                    "body": ["Plus Jakarta Sans"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #faf9f4; }
        .serif-text { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="text-on-surface selection:bg-secondary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center px-4 h-16 bg-[#334537] dark:bg-[#1A241C]">
<div class="flex items-center w-full max-w-2xl mx-auto">
<span class="material-symbols-outlined text-[#FAF9F4] cursor-pointer active:scale-95 duration-200" data-icon="arrow_back">arrow_back</span>
<h1 class="ml-4 font-['Noto_Serif'] text-lg tracking-wide font-bold text-white">志愿者注册</h1>
</div>
</header>
<main class="pt-20 pb-28 px-6 max-w-2xl mx-auto">
<!-- Hero Section / Context -->
<section class="mb-8">
<h2 class="serif-text text-3xl font-bold text-primary mb-2 leading-tight">听见内心的呼唤</h2>
<p class="text-on-surface-variant leading-relaxed opacity-80 text-sm max-w-md">
                加入我们的志愿者团队。通过每一次小小的善举，我们共同构建一个充满爱与觉知的世界。
            </p>
</section>
<!-- Registration Form -->
<form class="space-y-6">
<!-- Section: Identity -->
<div class="space-y-6">
<div class="group border-b border-outline-variant/30 pb-1 focus-within:border-primary transition-colors duration-300">
<label class="block text-[10px] uppercase tracking-widest text-on-surface-variant/60 mb-0.5">姓名</label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-primary placeholder:text-outline-variant/50 serif-text text-base" placeholder="您的称呼" type="text"/>
</div>
<div class="group border-b border-outline-variant/30 pb-1 focus-within:border-primary transition-colors duration-300">
<label class="block text-[10px] uppercase tracking-widest text-on-surface-variant/60 mb-0.5">联系电话</label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-primary placeholder:text-outline-variant/50 text-base" placeholder="138 **** ****" type="tel"/>
</div>
<div class="group border-b border-outline-variant/30 pb-1 focus-within:border-primary transition-colors duration-300">
<label class="block text-[10px] uppercase tracking-widest text-on-surface-variant/60 mb-0.5">现居城市</label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-primary placeholder:text-outline-variant/50 text-base" placeholder="所在城市" type="text"/>
</div>
</div>
<!-- Section: Intention -->
<div class="space-y-4 pt-2">
<h3 class="serif-text text-sm text-on-surface-variant/70 tracking-widest">服务意向</h3>
<div class="flex flex-wrap gap-2">
<label class="relative cursor-pointer">
<input class="peer sr-only" type="checkbox"/>
<div class="px-5 py-1.5 rounded-full border border-outline-variant/20 bg-surface-container-low peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-transparent transition-all duration-300 text-xs">
                            社区关怀
                        </div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" type="checkbox"/>
<div class="px-5 py-1.5 rounded-full border border-outline-variant/20 bg-surface-container-low peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-transparent transition-all duration-300 text-xs">
                            环境保护
                        </div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" type="checkbox"/>
<div class="px-5 py-1.5 rounded-full border border-outline-variant/20 bg-surface-container-low peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-transparent transition-all duration-300 text-xs">
                            文化传承
                        </div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" type="checkbox"/>
<div class="px-5 py-1.5 rounded-full border border-outline-variant/20 bg-surface-container-low peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-transparent transition-all duration-300 text-xs">
                            心理咨询
                        </div>
</label>
</div>
</div>
<!-- Section: Statement -->
<div class="space-y-4 pt-2">
<div class="group border-b border-outline-variant/30 pb-1 focus-within:border-primary transition-colors duration-300">
<label class="block text-[10px] uppercase tracking-widest text-on-surface-variant/60 mb-0.5">心得 / 寄语</label>
<textarea class="w-full bg-transparent border-none p-0 focus:ring-0 text-primary placeholder:text-outline-variant/50 text-base resize-none min-h-[1.5rem]" placeholder="请简述您的初衷" rows="1"></textarea>
</div>
</div>
<!-- Bottom Action Area -->
<div class="pt-6 space-y-4">
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer appearance-none w-4 h-4 rounded-md border border-outline-variant/50 checked:bg-primary transition-all" type="checkbox"/>
<span class="material-symbols-outlined absolute text-[12px] text-white opacity-0 peer-checked:opacity-100 left-1/2 -translate-x-1/2" data-icon="check">check</span>
</div>
<span class="text-[11px] text-on-surface-variant/70 group-hover:text-primary transition-colors">我已阅读并同意《志愿者服务协议》与《隐私政策》</span>
</label>
<button class="w-full h-12 bg-primary text-on-primary font-medium rounded-xl hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 tracking-widest" type="submit">
<span>确认注册</span>
<span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-6 pb-6 pt-2 bg-[#FAF9F4]/95 dark:bg-[#1A241C]/95 backdrop-blur-md z-50 border-t border-[#334537]/5 shadow-[0_-4px_20px_rgba(74,93,78,0.04)]">
<a class="flex flex-col items-center justify-center text-[#334537]/50 dark:text-[#FAF9F4]/40 hover:bg-[#334537]/5 transition-colors px-4 py-1 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="auto_awesome">auto_awesome</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-medium">梵音</span>
</a>
<a class="flex flex-col items-center justify-center text-[#334537]/50 dark:text-[#FAF9F4]/40 hover:bg-[#334537]/5 transition-colors px-4 py-1 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="menu_book">menu_book</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-medium">禅理</span>
</a>
<a class="flex flex-col items-center justify-center text-[#334537] dark:text-[#C9B037] bg-[#C9B037]/10 rounded-xl px-4 py-1" href="#">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-medium">我的</span>
</a>
</nav>
</body></html>
