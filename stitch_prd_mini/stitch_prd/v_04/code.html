<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>提交执行结果</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#f5f4ef",
                        "inverse-surface": "#30312e",
                        "primary-fixed": "#d3e8d5",
                        "on-surface": "#1b1c19",
                        "on-background": "#1b1c19",
                        "background": "#faf9f4",
                        "secondary-fixed": "#fee264",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#211b00",
                        "surface-dim": "#dbdad5",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#291801",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f2f1ec",
                        "inverse-primary": "#b7ccb9",
                        "on-primary-fixed": "#0e1f13",
                        "surface-tint": "#506354",
                        "tertiary-container": "#6d5435",
                        "on-tertiary-container": "#ebcaa3",
                        "surface": "#faf9f4",
                        "on-error-container": "#93000a",
                        "secondary-container": "#fee264",
                        "surface-variant": "#e3e2de",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffddb6",
                        "primary-container": "#4a5d4e",
                        "on-tertiary-fixed-variant": "#594325",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#efeee9",
                        "on-secondary-container": "#756400",
                        "on-primary-container": "#c0d5c2",
                        "outline": "#737872",
                        "on-primary-fixed-variant": "#394b3d",
                        "surface-bright": "#faf9f4",
                        "tertiary": "#533d20",
                        "secondary": "#6e5e00",
                        "surface-container-high": "#e9e8e3",
                        "secondary-fixed-dim": "#e0c64b",
                        "primary": "#334537",
                        "primary-fixed-dim": "#b7ccb9",
                        "outline-variant": "#c3c8c1",
                        "on-surface-variant": "#434843",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#534600",
                        "surface-container-highest": "#e3e2de",
                        "tertiary-fixed-dim": "#e2c19b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif SC", "serif"],
                        "body": ["Plus Jakarta Sans", "sans-serif"],
                        "label": ["Plus Jakarta Sans", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3 { font-family: 'Noto Serif SC', serif; }
        .ink-wash {
            background: radial-gradient(circle at 10% 20%, rgba(74, 93, 78, 0.03) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(110, 94, 0, 0.02) 0%, transparent 30%);
        }
        .whisper-shadow {
            box-shadow: 0 12px 40px rgba(74, 93, 78, 0.06);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen pb-32 ink-wash">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 flex items-center w-full px-6 py-4 h-16 bg-[#FAF9F4]/80 dark:bg-stone-900/80 backdrop-blur-md">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-[#EFEEE9]/50 transition-colors active:scale-95 duration-300">
<span class="material-symbols-outlined text-[#334537]">arrow_back</span>
</button>
<h1 class="ml-4 text-xl font-bold text-[#334537] dark:text-[#EFEEE9] tracking-tight">提交执行结果</h1>
</header>
<main class="max-w-md mx-auto px-6 pt-6 space-y-8">
<!-- Task Overview: Small summary bar -->
<section class="bg-surface-container-low rounded-xl p-4 flex items-center justify-between whisper-shadow">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container text-xl">eco</span>
</div>
<div>
<p class="text-xs text-on-surface-variant font-medium uppercase tracking-widest">任务项目</p>
<h3 class="text-primary font-bold">湿地生态修复计划</h3>
</div>
</div>
<div class="text-right">
<p class="text-xs text-on-surface-variant font-medium uppercase tracking-widest">状态</p>
<span class="text-secondary font-bold">执行中</span>
</div>
</section>
<!-- Execution Form: Compact fields -->
<section class="space-y-6">
<div class="flex items-center gap-2 mb-2">
<span class="w-1 h-6 bg-secondary rounded-full"></span>
<h2 class="text-lg font-bold text-primary">执行详情</h2>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="text-[11px] text-on-surface-variant uppercase tracking-widest px-1">开始时间</label>
<div class="bg-surface-container-high rounded-lg p-3 text-sm text-primary font-medium flex items-center gap-2">
<span class="material-symbols-outlined text-sm">schedule</span>
                        08:30 AM
                    </div>
</div>
<div class="space-y-2">
<label class="text-[11px] text-on-surface-variant uppercase tracking-widest px-1">结束时间</label>
<div class="bg-surface-container-high rounded-lg p-3 text-sm text-primary font-medium flex items-center gap-2">
<span class="material-symbols-outlined text-sm">event_available</span>
                        10:45 AM
                    </div>
</div>
</div>
<div class="space-y-2">
<label class="text-[11px] text-on-surface-variant uppercase tracking-widest px-1">地理坐标 (自动定位)</label>
<div class="bg-surface-container-high rounded-lg p-3 text-sm text-primary font-medium flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-sm">location_on</span>
                        31.2304° N, 121.4737° E
                    </div>
<span class="text-[10px] bg-primary-container/10 text-primary-container px-2 py-0.5 rounded-full">已校验</span>
</div>
</div>
<div class="space-y-2">
<label class="text-[11px] text-on-surface-variant uppercase tracking-widest px-1">投放数量 / 规模</label>
<input class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant/40 focus:ring-0 focus:border-primary transition-all p-3 text-primary font-medium" placeholder="请输入数值（如：500株/10kg）" type="text"/>
</div>
</section>
<!-- Visual Evidence: Photo upload placeholders -->
<section class="space-y-6">
<div class="flex items-center gap-2 mb-2">
<span class="w-1 h-6 bg-secondary rounded-full"></span>
<h2 class="text-lg font-bold text-primary">影像凭证</h2>
</div>
<div class="grid grid-cols-1 gap-4">
<!-- Large Placeholder for Main Evidence -->
<div class="relative group">
<div class="w-full aspect-[16/9] rounded-2xl bg-surface-container overflow-hidden border-2 border-dashed border-outline-variant/50 flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-primary/30 text-5xl mb-2">add_a_photo</span>
<span class="text-primary font-medium">苗种凭证</span>
<span class="text-[10px] text-on-surface-variant/60 mt-1">清晰拍摄投放物细节</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="aspect-square rounded-2xl bg-surface-container overflow-hidden border-2 border-dashed border-outline-variant/50 flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container-high transition-colors p-4 text-center">
<span class="material-symbols-outlined text-primary/30 text-3xl mb-2">video_camera_front</span>
<span class="text-sm text-primary font-medium">过程记录</span>
</div>
<div class="aspect-square rounded-2xl bg-surface-container overflow-hidden border-2 border-dashed border-outline-variant/50 flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container-high transition-colors p-4 text-center">
<span class="material-symbols-outlined text-primary/30 text-3xl mb-2">photo_camera_back</span>
<span class="text-sm text-primary font-medium">全景影像</span>
</div>
</div>
</div>
</section>
<!-- Vow & Submit -->
<section class="space-y-6 pb-8">
<div class="bg-surface-container-lowest p-6 rounded-2xl whisper-shadow border border-outline-variant/10">
<label class="flex items-start gap-4 cursor-pointer">
<div class="relative flex items-center mt-1">
<input class="peer h-5 w-5 rounded border-outline-variant text-primary focus:ring-primary-container" type="checkbox"/>
</div>
<div class="space-y-1">
<p class="text-sm font-bold text-primary">诚信执行宣誓</p>
<p class="text-xs text-on-surface-variant leading-relaxed">我谨以至诚宣布，以上所提交之执行结果均属实且符合生态投放标准，本人愿为此承担相应之社会信用责任。</p>
</div>
</label>
</div>
<button class="w-full bg-primary-container text-on-primary-container h-14 rounded-xl font-bold flex items-center justify-center gap-2 hover:brightness-110 active:scale-[0.98] transition-all whisper-shadow">
<span class="material-symbols-outlined">send</span>
                提交任务报告
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full flex justify-around items-center px-4 py-3 bg-[#FAF9F4]/80 dark:bg-stone-900/80 backdrop-blur-xl border-t border-[#4A5D4E]/5 z-50 shadow-[0_-4px_20px_rgba(74,93,78,0.04)]">
<a class="flex flex-col items-center justify-center text-[#4A5D4E]/50 dark:text-stone-500 hover:text-[#334537] transition-colors" href="#">
<span class="material-symbols-outlined">library_music</span>
<span class="text-[11px] uppercase tracking-widest mt-1">梵音</span>
</a>
<a class="flex flex-col items-center justify-center text-[#4A5D4E]/50 dark:text-stone-500 hover:text-[#334537] transition-colors" href="#">
<span class="material-symbols-outlined">self_improvement</span>
<span class="text-[11px] uppercase tracking-widest mt-1">禅理</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#C9B037]/20 text-[#334537] dark:text-[#EFEEE9] rounded-xl px-4 py-1" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-[11px] uppercase tracking-widest mt-1">我的</span>
</a>
</nav>
</body></html>
