<body class="bg-surface text-on-surface min-h-screen ink-wash-bg">

<header class="bg-stone-50/40 dark:bg-stone-900/40 backdrop-blur-xl fixed top-0 w-full z-50 shadow-[0_12px_40px_rgba(74,93,78,0.06)]">
<div class="flex items-center w-full px-6 h-16">

<span class="material-symbols-outlined text-emerald-900 dark:text-emerald-50">arrow_back</span>
</button>
<h1 class="text-xl font-bold text-emerald-900 dark:text-emerald-100 font-headline">系统设置</h1>
</div>
</header>

<div class="mb-8">
<h2 class="text-xs font-bold tracking-widest text-stone-400 mb-4 px-2 font-label">偏好设置</h2>
<div class="bg-surface-container-lowest rounded-xl overflow-hidden shadow-[0_4px_20px_rgba(74,93,78,0.02)]">

<span class="text-on-surface font-medium">推送通知</span>
<span class="text-xs text-stone-400 mt-0.5">每日禅理提醒</span>
</div>
<div class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</div>
</div>
<!-- Divider -->
<div class="mx-5 h-[1px] bg-outline-variant opacity-15"></div>
<!-- Audio Auto-play -->
<div class="flex items-center justify-between p-5 group hover:bg-surface-container transition-colors">
<div class="flex flex-col">
<span class="text-on-surface font-medium">音频自动播放</span>
<span class="text-xs text-stone-400 mt-0.5">进入详情页自动播放梵音</span>
</div>
<div class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-stone-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</div>
</div>
</div>
</div>
<!-- Settings Group 2: Display & Cache -->
<div class="mb-8">
<h2 class="text-xs font-bold tracking-widest text-stone-400 mb-4 px-2 font-label">通用</h2>
<div class="bg-surface-container-lowest rounded-xl overflow-hidden shadow-[0_4px_20px_rgba(74,93,78,0.02)]">
<!-- Dark Mode -->
<div class="flex items-center justify-between p-5 group hover:bg-surface-container transition-colors">
<span class="text-on-surface font-medium">深色模式</span>
<div class="flex items-center gap-2 text-stone-500">
<span class="text-sm">跟随系统</span>
<span class="material-symbols-outlined text-sm">chevron_right</span>
</div>
</div>
<!-- Divider -->
<div class="mx-5 h-[1px] bg-outline-variant opacity-15"></div>
<!-- Cache -->
<div class="flex items-center justify-between p-5 group hover:bg-surface-container transition-colors">
<div class="flex flex-col">
<span class="text-on-surface font-medium">清理缓存</span>
<span class="text-xs text-stone-400 mt-0.5">12.4 MB</span>
</div>
<button class="px-4 py-1.5 rounded-lg bg-surface-container-high text-primary-container text-sm font-semibold hover:bg-stone-200 transition-colors active:scale-95">清理</button>
</div>
<!-- Divider -->
<div class="mx-5 h-[1px] bg-outline-variant opacity-15"></div>
<!-- Update -->
<div class="flex items-center justify-between p-5 group hover:bg-surface-container transition-colors">
<span class="text-on-surface font-medium">检查更新</span>
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-error animate-pulse"></div>
<span class="material-symbols-outlined text-stone-400">arrow_forward</span>
</div>
</div>
</div>
</div>

<div class="flex gap-6">
<a class="text-stone-400 hover:text-emerald-700 text-xs tracking-wide transition-colors" href="#">关于我们</a>
<a class="text-stone-400 hover:text-emerald-700 text-xs tracking-wide transition-colors" href="#">隐私政策</a>
<a class="text-stone-400 hover:text-emerald-700 text-xs tracking-wide transition-colors" href="#">用户协议</a>
</div>
<p class="text-stone-400 text-xs tracking-wide">© 2024 The Breath of Silence</p>
</footer>

<span class="material-symbols-outlined" data-icon="self_improvement">self_improvement</span>

</div>

<div class="flex flex-col items-center justify-center bg-yellow-400/20 text-yellow-800 dark:text-yellow-200 rounded-xl p-2 transition-all active:scale-95 duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-[10px] mt-1 font-label">我的</span>
