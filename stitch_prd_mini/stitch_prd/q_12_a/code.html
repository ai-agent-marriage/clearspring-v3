<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>护生记录详情</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .serif { font-family: 'Noto Serif SC', serif; }
        .sans { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .ink-wash-bg {
            background: radial-gradient(circle at center, rgba(51, 69, 55, 0.08) 0%, transparent 70%);
            mask-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
        }
        
        .zen-shadow {
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.04);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#fee264",
                        "on-secondary-fixed": "#211b00",
                        "primary-fixed": "#d3e8d5",
                        "surface-container-highest": "#e3e2de",
                        "inverse-surface": "#30312e",
                        "surface-dim": "#dbdad5",
                        "on-primary-fixed": "#0e1f13",
                        "on-secondary-fixed-variant": "#534600",

                        "background": "#faf9f4",
                        "surface-container": "#efeee9",
                        "surface-variant": "#e3e2de",
                        "on-primary-container": "#c0d5c2",
                        "outline": "#737872",
                        "tertiary-container": "#6d5435",
                        "primary": "#334537",
                        "surface-tint": "#506354",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#e0c64b",
                        "on-secondary-container": "#756400",
                        "tertiary-fixed": "#ffddb6",
                        "surface-bright": "#faf9f4",
                        "on-background": "#1b1c19",
                        "on-tertiary-fixed-variant": "#594325",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#f2f1ec",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    }
                }
            }
        }
    </script>
<style>
        body {
            min-height: max(884px, 100dvh);
        }

<body class="bg-background text-on-surface sans antialiased pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-primary dark:bg-stone-900 shadow-sm flex justify-between items-center px-4 h-14">
<div class="flex items-center gap-4">
<button class="text-[#FAF9F4] hover:opacity-80 transition-opacity active:scale-95 duration-200" style="">
<span class="material-symbols-outlined" data-icon="arrow_back" style="">arrow_back</span>
</button>
<h1 class="font-serif text-lg tracking-wide text-[#FAF9F4]" style="">护生记录详情</h1>
</div>
<button class="text-[#FAF9F4] hover:opacity-80 transition-opacity active:scale-95 duration-200" style="">
<span class="material-symbols-outlined" data-icon="share" style="">share</span>
</button>
</header>
<main class="mt-14 p-4 space-y-6">
<!-- Status Card -->
<section class="bg-surface-container-lowest p-6 rounded-2xl zen-shadow flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-2xl" data-icon="check_circle" style='font-variation-settings: "FILL" 1;'>check_circle</span>
</div>
<div>
<h2 class="font-serif text-xl text-primary font-bold" style="">已完成</h2>
<p class="text-xs text-on-surface-variant" style="">感谢您的慈悲护生，功德圆满</p>
</div>
</div>
<div class="text-right hidden sm:block">
<p class="text-[10px] text-outline uppercase tracking-widest" style="">Record Status</p>
</div>
</section>
<!-- Sincere Wish Section -->
<section class="relative py-8 px-6 overflow-hidden rounded-2xl zen-shadow bg-surface-container-low flex flex-col items-center justify-center text-center">
<div class="absolute inset-0 ink-wash-bg opacity-60"></div>
<div class="relative z-10 space-y-3">
<div class="flex justify-center mb-1">
<span class="text-primary/40 text-xs tracking-widest font-serif" style="">—— 诚挚心愿 ——</span>
</div>
<p class="font-serif text-xl text-primary leading-relaxed px-4" style="">
                    愿以此功德，普及于一切。<br/>我等与众生，皆共成佛道。
                </p>
<div class="w-8 h-px bg-primary/20 mx-auto mt-4"></div>
</div>
</section>
<!-- Record Details: Bento Layout -->
<section class="grid grid-cols-2 gap-4">
<div class="col-span-2 bg-surface-container-low/50 p-5 rounded-2xl zen-shadow">
<div class="flex items-center gap-2 mb-2 text-primary/70">
<span class="material-symbols-outlined text-sm" data-icon="calendar_today" style="">calendar_today</span>
<span class="text-[10px] font-semibold uppercase tracking-wider" style="">护生日期</span>
</div>
<p class="font-serif text-lg text-primary" style="">2024-03-20</p>
</div>
<div class="bg-surface-container-low/50 p-5 rounded-2xl zen-shadow">
<div class="flex items-center gap-2 mb-2 text-primary/70">
<span class="material-symbols-outlined text-sm" data-icon="location_on" style="">location_on</span>
<span class="text-[10px] font-semibold uppercase tracking-wider" style="">护生水域</span>
</div>
<p class="font-serif text-base text-primary" style="">怀柔水库</p>
</div>
<div class="bg-surface-container-low/50 p-5 rounded-2xl zen-shadow">
<div class="flex items-center gap-2 mb-2 text-primary/70">
<span class="material-symbols-outlined text-sm" data-icon="category" style="">category</span>
<span class="text-[10px] font-semibold uppercase tracking-wider" style="">护生物种</span>
</div>
<p class="font-serif text-base text-primary" style="">红锦鲤</p>
</div>
<div class="bg-surface-container-low/50 p-5 rounded-2xl zen-shadow">
<div class="flex items-center gap-2 mb-2 text-primary/70">
<span class="material-symbols-outlined text-sm" data-icon="format_list_numbered" style="">format_list_numbered</span>
<span class="text-[10px] font-semibold uppercase tracking-wider" style="">投放数量</span>
</div>
<p class="font-serif text-base text-primary" style="">10 尾</p>
</div>
<div class="bg-surface-container-low/50 p-5 rounded-2xl zen-shadow">
<div class="flex items-center gap-2 mb-2 text-primary/70">
<span class="material-symbols-outlined text-sm" data-icon="schedule" style="">schedule</span>
<span class="text-[10px] font-semibold uppercase tracking-wider" style="">提交时间</span>
</div>
<p class="font-serif text-base text-primary" style="">14:30:22</p>
</div>
</section>
<!-- Photo Grid -->
<section class="space-y-4">
<div class="flex items-center justify-between px-1">
<h3 class="font-serif text-lg text-primary" style="">现场照片</h3>
<span class="text-[10px] text-outline tracking-widest uppercase" style="">Live Photos</span>
</div>
<div class="grid grid-cols-3 gap-3">
<div class="aspect-square rounded-xl overflow-hidden zen-shadow bg-surface-container-highest">
<img alt="放生现场照片" class="w-full h-full object-cover grayscale-[20%] hover:grayscale-0 transition-all duration-500" data-alt="peaceful close-up of bright orange koi fish swimming in clear water with ripples and soft natural light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDuVHH6vqQP9kYJ8nprnGN_waevKGYVoONYwhP675G3CPLwqQf9Csc7CJHhpdn9MM1hq2CJVvuNTuGH-DnZJ5FYBZeGYVPi6eB6KS4TCeZJ_toI9Ptl26N-3BmBCXVTFS9hcqX-jz5v8l6X4YNZMfJDxQbq8Y5r8b6kFG25p0lr2rdrOTjHGFdJDaoCxdW1PCn5QSqeEApfUvB833hkgdnKL1PhgKMzmzPfckcG9DTFhqVGgUf7Tld_1N1upmF5dj-PJpHgB2_VOzlF" style=""/>
</div>
<div class="aspect-square rounded-xl overflow-hidden zen-shadow bg-surface-container-highest">
<img alt="放生地点全景" class="w-full h-full object-cover grayscale-[20%] hover:grayscale-0 transition-all duration-500" data-alt="wide panoramic view of a serene mountain lake at dawn with mist rising and soft green foliage reflected in the water" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDViqVkY4Uo69zw2HKkPy05_m-PQBPqF8uFqqa7GMphjM_QIHizEViRokhtr_Pm6p1uM3klY6dRQr6IhiJkUZCMtiFu64vI26kiONxAT3HupmivPxxO6KYKR6eWbGPLAX-RLa8MUjzBB1nxrbIc8dsL6cXHRxAm-_257KfyzeBCAo5H9mIgPvDSyzzUcKeYIc5tra3M9sRA-BetAS-riDuOUAB9GfioA-kkbYmQWZQSg7vUbiE14yk9Y7iF-dS4gzMcHnXJyN7g1FRp" style=""/>
</div>
<div class="aspect-square rounded-xl overflow-hidden zen-shadow bg-surface-container-highest">
<img alt="护生活动细节" class="w-full h-full object-cover grayscale-[20%] hover:grayscale-0 transition-all duration-500" data-alt="gentle hands releasing a small colorful fish into a clear river with sunlight shimmering on the water surface" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDddZ2n7hvxN95qfnff-_1j411sv3nMX_870QjjYzVEk04vMs1cAeMZTJ5qN20Ju3yJEe88a0KJpR5oKlv9MKZKqAmD_bCzFMicVHJKw44-eF_WNCVKQLJaXyT_nKVk0dl_anbEi5q7K0yqCQgs39KXw2QmFclRAI678aVzdfyMNmE79UGsS8vS0VktDBbnG3AnW3THhPiI7ej3euqqjGs62NWTIqCwgQOtSGuAKMdkiu7_GWCiuqrSQU8Mwu6Z_8YNvPQwixb08Qtz" style=""/>
</div>
</div>
</section>
<!-- Balanced Actions Section -->
<section class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 bg-[#C9B037] text-white py-4 rounded-2xl font-semibold shadow-lg shadow-[#C9B037]/20 hover:bg-[#B89F2E] transition-all active:scale-[0.98] active:shadow-inner text-sm" style="">
<span class="material-symbols-outlined text-lg" data-icon="workspace_premium" style="">workspace_premium</span>
            查看电子证书
        </button>
<button class="flex items-center justify-center gap-2 bg-white border border-primary/20 text-primary py-4 rounded-2xl font-semibold zen-shadow hover:bg-surface-container-low transition-all active:scale-[0.98] text-sm" style="">
<span class="material-symbols-outlined text-lg" data-icon="edit_note" style="">edit_note</span>
            编辑修改记录
        </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-6 pb-8 pt-3 bg-background/80 backdrop-blur-2xl z-50 border-t border-black/5">
<button class="flex flex-col items-center justify-center text-outline/60 px-4 py-1 hover:text-primary transition-colors active:scale-90 duration-300" style="">
<span class="material-symbols-outlined" data-icon="library_music" style="">library_music</span>
<span class="font-sans text-[10px] tracking-tight mt-1" style="">梵音</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary text-white rounded-2xl px-5 py-2 zen-shadow transition-transform active:scale-95 duration-300" style="">
<span class="material-symbols-outlined" data-icon="self_improvement" style="">self_improvement</span>
<span class="font-sans text-[10px] tracking-tight mt-0.5" style="">禅理</span>
</button>
<button class="flex flex-col items-center justify-center text-outline/60 px-4 py-1 hover:text-primary transition-colors active:scale-90 duration-300" style="">
<span class="material-symbols-outlined" data-icon="person" style="">person</span>
<span class="font-sans text-[10px] tracking-tight mt-1" style="">我的</span>
</button>
</nav>
</body></html>
